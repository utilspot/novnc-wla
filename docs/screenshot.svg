<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6d8f"/>
      <stop offset="1" stop-color="#16303f"/>
    </linearGradient>
    <clipPath id="frame"><rect width="960" height="600" rx="6"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="960" height="600" fill="#000"/>

    <!-- app header -->
    <g>
      <rect width="960" height="44" fill="#1a1a1a"/>
      <rect y="43" width="960" height="1" fill="#333"/>

      <!-- Home button -->
      <rect x="14" y="11" width="58" height="22" rx="4" fill="#262626" stroke="#444"/>
      <text x="43" y="26" fill="#ddd" font-size="12" text-anchor="middle">Home</text>

      <!-- title -->
      <text x="88" y="27" fill="#eee" font-size="13" font-weight="600" letter-spacing="0.3">VNC Screen</text>

      <!-- status -->
      <circle cx="856" cy="22" r="4" fill="#7dd47d"/>
      <text x="868" y="26" fill="#7dd47d" font-size="12">Connected</text>
    </g>

    <!-- remote screen (VNC framebuffer) -->
    <g transform="translate(0,44)">
      <rect width="960" height="556" fill="url(#wallpaper)"/>

      <!-- remote desktop top panel -->
      <rect width="960" height="28" fill="#23262b" opacity="0.92"/>
      <text x="16" y="19" fill="#e6e6e6" font-size="12" font-weight="600">Activities</text>
      <text x="452" y="19" fill="#cfd3d8" font-size="12">Wed 14:07</text>
      <g fill="#cfd3d8">
        <rect x="876" y="9" width="14" height="10" rx="1"/>
        <path d="M900 15l4-4 4 4-4 4z"/>
        <circle cx="924" cy="14" r="5"/>
      </g>

      <!-- terminal window -->
      <g transform="translate(150,86)">
        <rect width="620" height="360" rx="8" fill="#1e1e1e" stroke="#000" stroke-opacity="0.4"/>
        <rect width="620" height="30" rx="8" fill="#333"/>
        <rect y="16" width="620" height="14" fill="#333"/>
        <circle cx="18" cy="15" r="5" fill="#ff5f56"/>
        <circle cx="36" cy="15" r="5" fill="#ffbd2e"/>
        <circle cx="54" cy="15" r="5" fill="#27c93f"/>
        <text x="310" y="19" fill="#bbb" font-size="11" text-anchor="middle" font-family="monospace">user@remote: ~</text>

        <g font-family="monospace" font-size="12.5">
          <text x="16" y="54" fill="#7dd47d">user@remote</text>
          <text x="104" y="54" fill="#ddd">:</text>
          <text x="112" y="54" fill="#6db3ff">~</text>
          <text x="122" y="54" fill="#ddd">$ uname -a</text>
          <text x="16" y="76" fill="#cfcfcf">Linux remote 6.8.0 #1 SMP x86_64 GNU/Linux</text>

          <text x="16" y="104" fill="#7dd47d">user@remote</text>
          <text x="104" y="104" fill="#ddd">:</text>
          <text x="112" y="104" fill="#6db3ff">~</text>
          <text x="122" y="104" fill="#ddd">$ vncserver -list</text>
          <text x="16" y="126" fill="#cfcfcf">X DISPLAY #   RFB PORT #   PROCESS ID</text>
          <text x="16" y="146" fill="#cfcfcf">:1           5901         2417</text>

          <text x="16" y="174" fill="#7dd47d">user@remote</text>
          <text x="104" y="174" fill="#ddd">:</text>
          <text x="112" y="174" fill="#6db3ff">~</text>
          <text x="122" y="174" fill="#ddd">$ htop</text>

          <text x="16" y="202" fill="#9fe0a0">  1  [||||||||||          28%]</text>
          <text x="16" y="222" fill="#9fe0a0">  2  [|||||               15%]</text>
          <text x="16" y="242" fill="#e0d79f">  Mem[|||||||||||||     2.1G/8G]</text>

          <text x="16" y="272" fill="#7dd47d">user@remote</text>
          <text x="104" y="272" fill="#ddd">:</text>
          <text x="112" y="272" fill="#6db3ff">~</text>
          <text x="122" y="272" fill="#ddd">$ <tspan fill="#ffffff">_</tspan></text>
        </g>
      </g>

      <!-- dock -->
      <g transform="translate(330,486)">
        <rect width="300" height="52" rx="12" fill="#1b1e24" opacity="0.82"/>
        <rect x="14" y="10" width="32" height="32" rx="7" fill="#3a7bd5"/>
        <rect x="58" y="10" width="32" height="32" rx="7" fill="#2ec7a6"/>
        <rect x="102" y="10" width="32" height="32" rx="7" fill="#e8863b"/>
        <rect x="146" y="10" width="32" height="32" rx="7" fill="#d5533a"/>
        <rect x="190" y="10" width="32" height="32" rx="7" fill="#8e6bd0"/>
        <rect x="234" y="10" width="32" height="32" rx="7" fill="#555b66"/>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="959" height="599" rx="6" fill="none" stroke="#000" stroke-opacity="0.25"/>
</svg>
